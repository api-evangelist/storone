aid: storone
name: StorONE
description: StorONE builds S1, a software-defined enterprise storage platform that consolidates block,
  file and object storage onto a single hardware-agnostic engine, with auto-tiering across flash and disk,
  snapshots, replication, erasure coding and NAS/object services managed as one system. S1 is delivered
  as software that customers deploy on their own commodity servers or on validated partner hardware, so
  the management surface — the OmniUI web console, the StorONE CLI client and the S1 REST API — is served
  by the customer's own controller nodes rather than by a StorONE-hosted cloud. The REST API is documented
  in the public StorONE Documents Repository at docs.onestor.com and covers applications, volumes, snapshots,
  shares, object stores, hosts, mappings, NAS servers, nodes, resources, replication, floating IPs, templates,
  workflows, monitoring and notifications. StorONE also serves a Model Context Protocol endpoint from
  its marketing site.
