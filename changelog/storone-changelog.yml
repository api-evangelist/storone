entries:
  - version: 3.8.0
    date: null
    url: https://docs.onestor.com/books/38-release-notes/page/380-release-notes
    breaking: false
    highlights:
      system:
        - Embedded management service — no external relay machine required.
        - >-
          Multi-system management (MSM), a lightweight service installed on a Windows machine or VM
          to manage multiple systems; required as a quorum witness when replicating between systems
          with embedded management services.
        - Drives can be unapproved from a pool so they can be reused in another pool.
        - Drive revival.
        - Improved drive LED support.
        - Volume recycle bin with configurable retention.
        - Secure erase for drives with multiple methods (Shred, Sanitize, NVMe formats).
        - New licensing mechanism with GUI and CLI support.
        - Self-service version upgrades.
        - SSD pool support for file system metadata.
        - Custom SMTP settings.
        - Floating IP pairing without the "Dummy" designation.
      auto_tiering:
        - System idleness based on specific drive pool utilization.
        - HA-aware lower tier locks for evacuation.
      omniui_gui_cli_rest_api:
        - Multi-admin approval for critical changes, configured with action policies.
        - Enhanced MFA with automatic reconnection.
        - Improved configuration history with user tracking.
      gui:
        - Context-specific action buttons per element (Edit, Delete, Secure Erase).
      replication:
        - Configurable witness settings via CLI and GUI.
        - Witness log viewing.
      snapshots:
        - Distributed VSS snapshot support for NFS datastores.
        - Improved snapshot deletion scheduler.
      logging:
        - Audit log for user operations and configuration changes.
        - System console log access from the GUI and CLI.
    fixed:
      - Host mapping deletion via the web UI.
      - Distributed VSS snapshot consistency.
    behavior_changes:
      - Evacuation messages removed from the console log.
