name: StorONE S1 release notes
description: >-
  StorONE publishes release notes per S1 release inside the public documentation repository, one
  BookStack book per minor line. Each release page is structured — New Features and Improvements
  (broken out by System, Auto-tiering, OmniUI, GUI, Replication, Snapshots, Logging), Fixed Issues,
  and Behavior Changes — which makes it a genuine changelog rather than a marketing what's-new.
  What it is not is dated: the pages carry BookStack revision timestamps, not release dates, so a
  reader cannot tell when 3.8.0 shipped from the changelog itself.
scheme: product release (major.minor.patch)
current_version: 3.8.0
dated: false
dated_note: >-
  No release dates are published on any release-notes page. The only time signal is BookStack's own
  "Updated N months ago" metadata on the page revision — the 3.8.0 page showed "Updated 8 months
  ago" when read on 2026-08-29.
