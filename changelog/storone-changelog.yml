finding_reference_lag:
  observation: >-
    The 3.8.0 release notes describe capabilities the published REST API reference does not carry —
    drive unapprove and revive, secure erase, licensing (license upload / license view), volume
    recycle bin, and multi-admin approval action policies. The REST API book's pages were last
    revised roughly two years before this read, while 3.8.0 is roughly eight months old.
  consequence: >-
    An integrator reading docs.onestor.com/books/rest-api is reading a pre-3.8 surface. The
    operation inventory captured elsewhere in this repo is therefore a floor, not a ceiling — the
    real 3.8.0 API is larger than the 164 operations documented.
