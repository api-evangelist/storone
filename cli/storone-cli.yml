  - group: settings
    url: https://docs.onestor.com/books/cli/page/settings
  - group: floating ips
    url: https://docs.onestor.com/books/cli/page/floating-ips
  - group: hosts
    url: https://docs.onestor.com/books/cli/page/hosts
  - group: monitoring
    url: https://docs.onestor.com/books/cli/page/monitoring
  - group: nodes
    url: https://docs.onestor.com/books/cli/page/nodes
  - group: notifications
    url: https://docs.onestor.com/books/cli/page/notifications
  - group: nas
    url: https://docs.onestor.com/books/cli/page/nas
newer_commands_from_release_notes:
  note: Named in the 3.8.0 release notes but not yet in the CLI book.
  commands:
    - resources drives unapprove
    - resources drives revive
    - action_policies create
    - license upload
    - license view
  source: https://docs.onestor.com/books/38-release-notes/page/380-release-notes
local_storage:
  note: >-
    The CLI can save metrics and logs to the folder containing the executable, which needs disk
    capacity beyond the 150 MB install footprint.
