name: StorONE packages and SDKs
description: >-
  StorONE publishes no client libraries. There is no SDK in any package registry, no GitHub
  organization, and no first-party wrapper for the S1 REST API in any language. The only first-party
  client software is the S1 CLI, and it is distributed as a binary downloaded from the customer's own
  controller node rather than from a registry — so it has no version metadata endpoint to query and
  no public URL. The nearest thing to an SDK StorONE offers is a ~40-line reference Python script in
  the docs, published under a permissive reference-design licence, that logs in and lists volumes.
