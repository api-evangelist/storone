consequence: >-
  With no SDK and no OpenAPI document published, every integrator writes their own HTTP client from
  the reference pages by hand. That is the single largest developer-experience gap in this profile
  and the cheapest one for StorONE to close — the widdershins-shaped reference proves an OpenAPI
  document already exists internally.
