name: StorONE S1 REST API rate limits
description: >-
  StorONE documents no rate limits for the S1 REST API, and this is a case where the absence is
  structurally correct rather than an oversight. The API is served by the customer's own controller
  nodes to the customer's own operators — there is no shared multi-tenant capacity to protect and no
  billing meter to enforce, so there is nobody to throttle. What that means for an agent is the
  reverse of the usual risk: nothing will stop a runaway polling loop except the storage
  controller's own CPU, and the controller is also serving production I/O.
