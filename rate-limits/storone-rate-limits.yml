  note: >-
    No X-RateLimit-*, RateLimit-* or Retry-After header is documented on any response. There is no
    runtime signal an agent can back off on.
exhaustion_status: null
exhaustion_note: >-
  429 does not appear on any of the 164 documented operations. The only documented failure codes are
  400 and, on login, 401.
timeouts:
  observed: >-
    A `limit` parameter appears on at least one operation as an operation timeout — "Set limit for
    the operation (by default it is set to 10 seconds)" — which is a per-call deadline, not a rate
    limit.
session_limits:
  inactivity_timeout: >-
    The caller sets InactivityTimeoutInMinutes on POST /login. That is the only published throttle
    on API use, and it governs session lifetime rather than request rate.
agent_guidance: >-
  Poll the monitoring endpoints conservatively. GET /monitoring/performance/live,
  /monitoring/utilization/live and /monitoring/health/current are the obvious candidates for a tight
  loop, and they run on the same controllers that serve host I/O. Prefer the /history variants for
  trend data and treat the live endpoints as on-demand.
